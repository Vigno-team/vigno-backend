name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vigno_test
          POSTGRES_USER: vigno_user
          POSTGRES_PASSWORD: vigno_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: clave-solo-para-ci
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: vigno.settings.development
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: vigno_test
      POSTGRES_USER: vigno_user
      POSTGRES_PASSWORD: vigno_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Correr tests
        run: pytest
