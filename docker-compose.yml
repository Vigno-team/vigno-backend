services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py crear_admin_inicial &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # E1C-64: el dashboard sigue sin token hasta que el frontend lo mande.
      API_LECTURA_PUBLICA: ${API_LECTURA_PUBLICA:-True}
      # runserver queda expuesto directo, sin nginx delante.
      NUM_PROXIES: ${NUM_PROXIES:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
