name: ${COMPOSE_PROJECT_NAME:-agroclima-produccion}

x-seguridad: &seguridad
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  pids_limit: 256

# E1C-140: los logs rotan, para que no llenen el disco (5 archivos de 10 MB por servicio).
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-entorno: &entorno
  DJANGO_SETTINGS_MODULE: vigno.settings.production
  DEBUG: "False"
  INSTANCIA_CONFIG: ${INSTANCIA_CONFIG:-}
  SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY en deploy/.env}
  POSTGRES_DB: ${POSTGRES_DB:-agroclima}
  POSTGRES_USER: ${POSTGRES_USER:-agroclima}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
  ADMIN_HABILITADO: ${ADMIN_HABILITADO:-False}
  DOCS_HABILITADOS: ${DOCS_HABILITADOS:-False}
  DATOS_DIR: /app/data/cliente

services:
  db:
    <<: [*seguridad, *logs]
    build:
      context: ..
      dockerfile: deploy/postgres.Dockerfile
    user: postgres
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=999,gid=999
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agroclima}
      POSTGRES_USER: ${POSTGRES_USER:-agroclima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    <<: [*seguridad, *logs]
    user: "10001:10001"
    mem_limit: 1g
    cpus: 2.0
    build:
      context: ..
      target: production
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org/debian}
    restart: unless-stopped
    init: true
    environment:
      <<: *entorno
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      # E1C-64: el dashboard de la demo sigue sin token hasta que el frontend lo mande.
      API_LECTURA_PUBLICA: ${API_LECTURA_PUBLICA:-True}
      # Primer administrador (opcional): solo se crea si no existe.
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      # E1C-138: la cuenta por defecto admin@sistema.local / admin, solo si se activa.
      ADMIN_POR_DEFECTO: ${ADMIN_POR_DEFECTO:-False}
      # nginx es el único proxy delante: la IP real es la última de X-Forwarded-For.
      NUM_PROXIES: "1"
      # sin EMAIL_HOST no se ofrece recuperar la clave por correo.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
    volumes:
      - datos:/app/data/cliente
      - referencia:/app/data/referencia
      - staticfiles:/app/staticfiles
      - media:/app/media
      - ../config:/app/config:ro
      - ../data/raw:/app/data/raw:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  tareas:
    <<: [*seguridad, *logs]
    user: "10001:10001"
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    build:
      context: ..
      target: tareas
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org/debian}
    restart: unless-stopped
    init: true
    environment:
      <<: *entorno
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
      INTERVALO_ACTUALIZACION_MIN: ${INTERVALO_ACTUALIZACION_MIN:-360}
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    volumes:
      - datos:/app/data/cliente
      - referencia:/app/data/referencia
      - modelos:/app/apps/ml/artifacts
      - ../config:/app/config:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "deploy/tareas.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    stop_grace_period: 30s
  web:
    <<: [*seguridad, *logs]
    user: nginx
    mem_limit: 128m
    cpus: 0.5
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      additional_contexts:
        frontend: ${FRONTEND_DIR:-../../frontend}
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
    ports:
      - "${WEB_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      tareas:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
  # E1C-140: un respaldo diario de la base, DATOS_DIR y media/; se conservan los últimos 14.
  respaldos:
    <<: [*seguridad, *logs]
    # Misma imagen que restaurador: "up --build" la reconstruye y restaurador nunca queda con una
    # versión vieja (Docker copia el dueño de la imagen en un volumen vacío al montarlo).
    image: ${COMPOSE_PROJECT_NAME:-agroclima-produccion}-respaldos
    build:
      context: ..
      dockerfile: deploy/respaldos.Dockerfile
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    init: true
    environment: &entorno-respaldos
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-agroclima}
      POSTGRES_USER: ${POSTGRES_USER:-agroclima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      RESPALDOS_CONSERVAR: ${RESPALDOS_CONSERVAR:-14}
      RESPALDOS_CADA_HORAS: ${RESPALDOS_CADA_HORAS:-24}
    volumes:
      - respaldos:/respaldos
      - datos:/datos:ro
      - media:/media:ro
    depends_on:
      # El backend queda sano después de aplicar las migraciones: así el primer respaldo de una
      # instalación nueva ya tiene las tablas.
      backend:
        condition: service_healthy
    healthcheck:
      # Falla si el último respaldo tiene más de 26 horas.
      test: ["CMD", "respaldos", "salud"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
  # Solo para deploy/restaurar.sh y restaurar.ps1: no arranca con "up" (perfil restaurar).
  # Corre como el usuario de la aplicación para poder escribir en datos y media.
  restaurador:
    <<: [*seguridad, *logs]
    profiles: [restaurar]
    image: ${COMPOSE_PROJECT_NAME:-agroclima-produccion}-respaldos
    build:
      context: ..
      dockerfile: deploy/respaldos.Dockerfile
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g,mode=1777
    entrypoint: ["respaldos", "restaurar"]
    environment:
      <<: *entorno-respaldos
      HOME: /tmp
    volumes:
      - respaldos:/respaldos:ro
      - datos:/destino/datos
      - media:/destino/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  datos:
  referencia:
  modelos:
  staticfiles:
  media:
  respaldos:
