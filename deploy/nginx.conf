server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Docker puede cambiar la IP del backend cuando se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = /healthz { return 200 'ok'; }
    location = /data/climateData.json {
        proxy_pass $backend/api/v1/datos$is_args$args;
    }
    location /api/ { proxy_pass $backend$request_uri; }
    location /admin/ { proxy_pass $backend$request_uri; }
    location /static/ { alias /app/staticfiles/; }
    location / { try_files $uri $uri/ /index.html; }
}
