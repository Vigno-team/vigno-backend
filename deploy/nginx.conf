server_tokens off;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=cargas:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    return 308 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    root /usr/share/nginx/html;
    index index.html;
    # El Excel admite 20 MiB; dejar margen para la envoltura multipart.
    client_max_body_size 21m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    include /etc/nginx/security-headers.conf;
    add_header Strict-Transport-Security "max-age=${SECURE_HSTS_SECONDS}; includeSubDomains; preload" always;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;

    # Docker puede cambiar la IP del backend cuando se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Sobrescribir siempre: no confiar en el header enviado por el cliente.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = /healthz { return 200 'ok'; }
    location = /data/climateData.json {
        proxy_pass $backend/api/v1/datos$is_args$args;
    }
    location ~ ^/api/v1/auth(?:/|$) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass $backend$request_uri;
    }
    location ~ ^/api/v1/cargas(?:/|$) {
        limit_req zone=cargas burst=5 nodelay;
        proxy_pass $backend$request_uri;
    }
    location /api/ { proxy_pass $backend$request_uri; }
    location = /admin { proxy_pass $backend$request_uri; }
    location /admin/ { proxy_pass $backend$request_uri; }
    location /static/ { alias /app/staticfiles/; }
    location / { try_files $uri $uri/ /index.html; }
}
